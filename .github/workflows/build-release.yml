name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and test distribution
        run: mvn --batch-mode clean install

      - name: Publish stable download
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view release >/dev/null 2>&1; then
            gh release upload release target/Digital.zip --clobber
          else
            gh release create release target/Digital.zip \
              --title "Latest build" \
              --notes "Automatically built from the latest commit on master."
          fi

      - name: Save distribution for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: digital-distribution
          path: target/Digital.zip
          if-no-files-found: error

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: digital-distribution
          path: target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p pages
          unzip -q target/Digital.zip 'Digital/Digital.jar' 'Digital/lib/*' -d pages
          mv pages/Digital/Digital.jar pages/Digital.jar
          mv pages/Digital/lib pages/lib
          rmdir pages/Digital
          node scripts/create-lib-manifest.js pages/lib pages/manifest.json
          if [ -f index.html ]; then cp index.html pages/index.html; fi
          if [ -f CNAME ]; then cp CNAME pages/CNAME; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
